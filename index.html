<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMDH Tool</title>
    <meta name="description" content="An online SMDH file format creator/editor for 3DS homebrew apps.">
    <meta name="keywords" content="smdh, icon, 3ds, creator, editor, homebrew">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#24292e">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js"></script>
</head>
<body>
    <form id="file-form">
        <input id="file-load" type="file" onchange="tempFileLoadFunction.call(), el('file-form').reset()">
    </form>

    <div class="home-block">
        <div class="row row-icons">
            <label for="big-icon" class="label">Icons:</label>
            <canvas id="big-icon" class="button" onclick="clickImportBigCanvas()" width="48" height="48"></canvas>
            <canvas id="small-icon" class="button" onclick="clickImportSmallCanvas()" width="24" height="24"></canvas>
        </div>

        <div class="row checkbox-row">
            <input type="checkbox" checked="checked" id="both-icons">
            <label for="both-icons">Update both when importing</label>
        </div>

        <div id="langs">
            <div class="row" id="row-short-description">
                <label for="short-description" class="label">Short description:</label>
                <input id="short-description" type="text" maxlength="64" class="input">
            </div>

            <div class="row" id="row-long-description">
                <label for="long-description" class="label">Long description:</label>
                <input id="long-description" type="text" maxlength="128" class="input">
            </div>

            <div class="row" id="row-publisher">
                <label for="publisher" class="label">Publisher:</label>
                <input id="publisher" type="text" maxlength="64" class="input">
            </div>

            <div class="row" id="row-short-description2" style="display: none;">
                <label class="label" for="short-description2">Short description:</label>
                <input class="input" id="short-description2" maxlength="64">
            </div>
            <div class="row" id="row-long-description2" style="display: none;">
                <label class="label" for="long-description2">Long description:</label>
                <input class="input" id="long-description2" maxlength="128">
            </div>
            <div class="row" id="row-publisher2" style="display: none;">
                <label class="label" for="publisher2">Publisher:</label>
                <input class="input" id="publisher2" maxlength="64">
            </div>

            <div class="row" id="row-short-description3" style="display: none;">
                <label class="label" for="short-description3">Short description:</label>
                <input class="input" id="short-description3" maxlength="64">
            </div>
            <div class="row" id="row-long-description3" style="display: none;">
                <label class="label" for="long-description3">Long description:</label>
                <input class="input" id="long-description3" maxlength="128">
            </div>
            <div class="row" id="row-publisher3" style="display: none;">
                <label class="label" for="publisher3">Publisher:</label>
                <input class="input" id="publisher3" maxlength="64">
            </div>

            <div class="row" id="row-short-description4" style="display: none;">
                <label class="label" for="short-description4">Short description:</label>
                <input class="input" id="short-description4" maxlength="64">
            </div>
            <div class="row" id="row-long-description4" style="display: none;">
                <label class="label" for="long-description4">Long description:</label>
                <input class="input" id="long-description4" maxlength="128">
            </div>
            <div class="row" id="row-publisher4" style="display: none;">
                <label class="label" for="publisher4">Publisher:</label>
                <input class="input" id="publisher4" maxlength="64">
            </div>

            <div class="row" id="row-short-description5" style="display: none;">
                <label class="label" for="short-description5">Short description:</label>
                <input class="input" id="short-description5" maxlength="64">
            </div>
            <div class="row" id="row-long-description5" style="display: none;">
                <label class="label" for="long-description5">Long description:</label>
                <input class="input" id="long-description5" maxlength="128">
            </div>
            <div class="row" id="row-publisher5" style="display: none;">
                <label class="label" for="publisher5">Publisher:</label>
                <input class="input" id="publisher5" maxlength="64">
            </div>
        </div>

        <div class="row" id="lang-selector">
            <span class="label">Language:</span>
            <label style="background-color: #eef;border-radius:3px;padding:2px 4px" class="active-lang">
                <input type="radio" name="lang" onclick="changeLang(null)" checked="checked" id="default-lang">All
            </label>
            <label><input type="radio" name="lang"><span class="flag flag2"></span></label>
            <label><input type="radio" name="lang"><span class="flag flag3"></span></label>
            <label><input type="radio" name="lang"><span class="flag flag4"></span></label>
            <label><input type="radio" name="lang"><span class="flag flag5"></span></label>
        </div>

        <div class="row" id="lang-info">
            Leaving these fields empty will copy default values over when saving
        </div>

        <div class="actions-row">
            <input type="button" class="button" value="Load SMDH" onclick="clickLoadSMDH()">
            <input type="button" class="button blue-button" value="Save SMDH" onclick="clickSaveSMDH()">
        </div>
    </div>

    <div id="contributions">
        <b>Feel free to contribute by making a donation!</b>
        <a href="https://www.paypal.me/marcrobledo/3" class="donate-button" target="_blank" rel="nofollow">Donate</a>
    </div>

    <div id="footer">
        <div id="author">SMDH Tool <small>v1.2 by <a href="https://www.marcrobledo.com" target="_blank">Marc Robledo</a></small></div>
        <div id="thanks">Based on <a href="https://github.com/gemisis/SMDH-Creator" target="_blank">SMDH-Creator by Gemisis</a></div>
    </div>
</body>
</html>
